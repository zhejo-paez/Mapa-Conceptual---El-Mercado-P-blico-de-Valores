<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Mapa conceptual: el mercado público de valores</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fa;--ink:#0f2233;--mute:#55697c;--ln:#8a9bab;--x:#b5306a;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a26;--ink:#e8eff5;--mute:#9fb2c4;--ln:#6f869b;--x:#f08ab4;
--k0b:#2a2552;--k0:#b3acf0;--k1b:#123a38;--k1:#4fd1b0;--k2b:#1b3157;--k2:#8db3f0;--k3b:#3a2f12;--k3:#e8b84a;--k4b:#40231a;--k4:#f0987a;--k5b:#1f3a14;--k5:#9ad46a}}
:root[data-theme="dark"]{--bg:#0d1a26;--ink:#e8eff5;--mute:#9fb2c4;--ln:#6f869b;--x:#f08ab4;
--k0b:#2a2552;--k0:#b3acf0;--k1b:#123a38;--k1:#4fd1b0;--k2b:#1b3157;--k2:#8db3f0;--k3b:#3a2f12;--k3:#e8b84a;--k4b:#40231a;--k4:#f0987a;--k5b:#1f3a14;--k5:#9ad46a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
header{padding:32px 20px 8px;max-width:1100px;margin:0 auto}
h1{font:600 clamp(1.6rem,4vw,2.3rem)/1.2 Newsreader,Georgia,serif;margin:0 0 8px}
header p{margin:0;color:var(--mute);max-width:70ch}
.leg{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 0;font-size:.9rem;color:var(--mute)}
.leg i{display:inline-block;vertical-align:middle;width:34px;margin-right:6px;border-top:2px solid var(--ln)}
.leg i.d{border-top:2px dashed var(--x)}
.map{overflow-x:auto;padding:8px 12px 40px}
svg{display:block;min-width:1100px;width:100%;height:auto;margin:0 auto;max-width:1500px}
svg text{font-family:"IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
.ed{stroke:var(--ln);stroke-width:1.5;fill:none}
.cx{stroke:var(--x);stroke-width:1.8;stroke-dasharray:6 4;fill:none}
.lb{font-size:11.5px;font-style:italic;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.lx{font-size:11.5px;font-weight:500;fill:var(--x);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;text-anchor:middle}
.n rect{stroke-width:1.5}
.k0 rect{fill:var(--k0b);stroke:var(--k0)}.k1 rect{fill:var(--k1b);stroke:var(--k1)}.k2 rect{fill:var(--k2b);stroke:var(--k2)}.k3 rect{fill:var(--k3b);stroke:var(--k3)}.k4 rect{fill:var(--k4b);stroke:var(--k4)}.k5 rect{fill:var(--k5b);stroke:var(--k5)}
.h{font:600 17px Newsreader,Georgia,serif}.t{font-size:13.5px;font-weight:500}.s{font-size:12px;fill:var(--mute)}
</style>
</head>
<body>

o+='<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#8a9bab"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#b5306a"/></marker></defs>';
